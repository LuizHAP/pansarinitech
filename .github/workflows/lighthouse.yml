name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Performance / A11y / SEO / BP (production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Lighthouse failures block the deploy so regressions are caught early.
    steps:
      - uses: actions/checkout@v4

      # Wait for Vercel production deploy to complete before measuring.
      # Tune sleep based on observed deploy latency.
      - name: Wait for Vercel production
        run: sleep 60

      # localePrefix:'never' — URLs are locale-free. No /en/ or /pt/ prefix.
      # Locale detection via Accept-Language / cookie in middleware.
      - name: Run Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://pansarinitech.vercel.app/
            https://pansarinitech.vercel.app/now
            https://pansarinitech.vercel.app/projects
            https://pansarinitech.vercel.app/blog
            https://pansarinitech.vercel.app/blog/building-this-portfolio
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Open issue on regression
        if: steps.lh.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Lighthouse regression on main"
          content-filepath: .lighthouseci/manifest.json
          labels: lighthouse, performance, regression
