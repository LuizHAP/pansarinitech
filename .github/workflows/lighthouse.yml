name: Lighthouse

on:
  push:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Performance / A11y / SEO / BP (production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # D-17: regressions open an issue but never block deploys.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Wait for Vercel production deploy to complete before measuring.
      # Tune sleep based on observed deploy latency.
      - name: Wait for Vercel production
        run: sleep 60

      # Phase 2 Wave 1: /now URLs are placeholders until Plan 02-02 ships /now page.
      # Lighthouse main-only run may 404 on /en/now and /pt/now between Wave 1 and Wave 2
      # merges; D-17 continue-on-error keeps deploys unblocked.
      # 404 paths from Phase 1 (non-existent-route, nao-existe) removed — Lighthouse
      # cannot score 404 status responses (Phase 1 deferred-items.md).
      - name: Run Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://pansarinitech.vercel.app/en
            https://pansarinitech.vercel.app/pt
            https://pansarinitech.vercel.app/en/now
            https://pansarinitech.vercel.app/pt/now
            https://pansarinitech.vercel.app/en/projects
            https://pansarinitech.vercel.app/pt/projects
            https://pansarinitech.vercel.app/en/blog
            https://pansarinitech.vercel.app/pt/blog
            https://pansarinitech.vercel.app/en/blog/building-this-portfolio
            https://pansarinitech.vercel.app/pt/blog/building-this-portfolio
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Open issue on regression
        if: steps.lh.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Lighthouse regression on main"
          content-filepath: .lighthouseci/manifest.json
          labels: lighthouse, performance, regression
