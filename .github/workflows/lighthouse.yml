name: Lighthouse

on:
  deployment_status:

jobs:
  lighthouse:
    name: Lighthouse Performance / A11y / SEO / BP (production)
    # Vercel reports each deploy to GitHub; a fixed sleep after push could measure the
    # previous build, and PR runs only ever measured production.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # localePrefix:'always' — every route is served under /en or /pt. Hitting
      # a locale-free URL 307-redirects to /en/..., which would add an extra
      # round trip to every Lighthouse run and skew performance metrics, so
      # the /en prefix is included explicitly here.
      - name: Run Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://pansarinitech.vercel.app/en
            https://pansarinitech.vercel.app/en/now
            https://pansarinitech.vercel.app/en/projects
            https://pansarinitech.vercel.app/en/blog
            https://pansarinitech.vercel.app/en/blog/building-this-portfolio
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Open issue on regression
        if: steps.lh.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Lighthouse regression on main"
          content-filepath: .lighthouseci/manifest.json
          labels: lighthouse, performance, regression
