name: Generate Blog Post

on:
  schedule:
    - cron: "0 9 */5 * *"    # ~every 5 days at 09:00 UTC (days 1, 6, 11, 16, 21, 26, 31)
  workflow_dispatch:           # manual on-demand trigger from GitHub Actions UI

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # content generation needs more runway than ci.yml's 8 min
    permissions:
      contents: write          # required for git push (branch creation)
      pull-requests: write     # required for gh pr create

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Resolve topic and slug
        id: topic
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(node -e "
            const fs = require('fs');
            const state = fs.existsSync('content/blog/.pipeline-state.json')
              ? JSON.parse(fs.readFileSync('content/blog/.pipeline-state.json', 'utf8'))
              : { last_topic: null };
            console.log(state.last_topic || 'null');
          ")
          NEXT=$(node -e "
            const seq = ['nextjs-react-frontend','software-engineering-career','ai-in-development','personal-projects-open-source'];
            const last = process.argv[1] === 'null' ? null : process.argv[1];
            const idx = (() => {
              if (last === null) return 0;
              const found = seq.indexOf(last);
              if (found === -1) {
                process.stderr.write('ERROR: last_topic \"' + last + '\" not in sequence\n');
                process.exit(1);
              }
              return (found + 1) % seq.length;
            })();
            console.log(seq[idx]);
          " "$LAST")
          SLUG=$(node -e "
            const seq = ['nextjs-react-frontend','software-engineering-career','ai-in-development','personal-projects-open-source'];
            const fs = require('fs');
            const state = fs.existsSync('content/blog/.pipeline-state.json')
              ? JSON.parse(fs.readFileSync('content/blog/.pipeline-state.json', 'utf8'))
              : { run_count: 0, topic_sequence: seq };
            const runCount = state.run_count ?? 0;
            const cycle = Math.floor(runCount / seq.length);
            const suffix = cycle > 0 ? '-v' + (cycle + 1) : '';
            console.log(process.argv[1] + suffix);
          " "$NEXT")
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "topic=$NEXT" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Generate bilingual MDX post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ steps.topic.outputs.topic }}
          SLUG: ${{ steps.topic.outputs.slug }}
          TODAY: ${{ steps.topic.outputs.today }}
        run: node scripts/generate-post-openai.mjs

      - name: Assert generated files exist
        env:
          SLUG: ${{ steps.topic.outputs.slug }}
        run: |
          test -f "content/blog/${SLUG}.en.mdx" || { echo "ERROR: EN file not generated"; exit 1; }
          test -f "content/blog/${SLUG}.pt.mdx" || { echo "ERROR: PT file not generated"; exit 1; }
          test -f "content/blog/.pipeline-state.json" || { echo "ERROR: pipeline-state.json not written"; exit 1; }
          echo "All required files present."

      - name: Extract post title
        id: post-meta
        env:
          SLUG: ${{ steps.topic.outputs.slug }}
        run: |
          TITLE=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('content/blog/' + process.env.SLUG + '.en.mdx', 'utf8');
            const match = content.match(/^title:\s*[\"']?(.+?)[\"']?\s*$/m);
            console.log(match ? match[1] : process.env.SLUG);
          ")
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Verify blog content (parity + Zod)
        run: pnpm verify:posts

      - name: Create branch and commit
        env:
          SLUG: ${{ steps.topic.outputs.slug }}
          TODAY: ${{ steps.topic.outputs.today }}
          TOPIC: ${{ steps.topic.outputs.topic }}
        run: |
          BRANCH="content/auto-post-$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add "content/blog/${SLUG}.en.mdx" "content/blog/${SLUG}.pt.mdx" "content/blog/.pipeline-state.json"
          git commit -m "content(auto): ${TOPIC} post ${TODAY}"
          git push origin "$BRANCH" --no-verify

      - name: Open PR
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ steps.topic.outputs.topic }}
          TODAY: ${{ steps.topic.outputs.today }}
          POST_TITLE: ${{ steps.post-meta.outputs.title }}
          SLUG: ${{ steps.topic.outputs.slug }}
        run: |
          PR_URL=$(gh pr create \
            --title "[auto] ${POST_TITLE} (${TODAY})" \
            --body "$(cat <<BODY
          ## ${POST_TITLE}

          **Topic area:** ${TOPIC}
          **Slug:** \`${SLUG}\`
          **Date:** ${TODAY}

          ---

          ## Review checklist

          - [ ] Title and excerpt are accurate and compelling
          - [ ] PT version reads naturally — not a literal translation
          - [ ] No inline JS or dynamic imports in MDX body
          - [ ] Content is technically accurate and on-brand
          - [ ] Post is published with \`draft: false\` (default) — set to \`true\` to merge without publishing

          > Generated by the automated content pipeline (gpt-4o). Merge to publish immediately.
          BODY
          )" \
            --base main)
          PR_NUMBER=${PR_URL##*/}
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel preview (add repo secret for auto-preview)"
            exit 0
          fi
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          echo "VERCEL_PREVIEW_URL=$(npx vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" 2>/dev/null | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)" >> $GITHUB_ENV

      - name: Add preview URL to PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pr-number }}
          VERCEL_PREVIEW_URL: ${{ env.VERCEL_PREVIEW_URL }}
          SLUG: ${{ steps.topic.outputs.slug }}
        run: |
          if [ -z "$VERCEL_PREVIEW_URL" ]; then
            echo "No preview URL — skipping PR update"
            exit 0
          fi
          CURRENT_BODY="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          {
            printf '%s\n\n' "$CURRENT_BODY"
            printf '🔗 **Vercel Preview:** %s/blog/%s\n' "$VERCEL_PREVIEW_URL" "$SLUG"
          } > /tmp/pr-body.md
          gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md

      - name: Upload generated files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-post-debug
          path: content/blog/
          retention-days: 7
